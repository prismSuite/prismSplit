[project]
name = "prismsplit-engine"
version = "0.1.0"
description = "Internal audio separation engine for PrismSplit"
dependencies = [
    "numpy>=1.23.5,<2.0.0",
    "onnxruntime>=1.14.1",
    "librosa>=0.9.2,<0.10.0",
    "soundfile>=0.11.0",
    "torch",
    "PyYAML>=6.0",
    "scipy>=1.9.3",
]
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]
include = ["prismsplit_backends*", "prismsplit_engine*", "prismsplit_protocol*", "prismsplit_models*"]
