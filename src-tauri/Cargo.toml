[package]
name = "prismsplit"
version = "0.1.0"
description = "PrismSplit Stem Separator"
authors = ["PrismSplit"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
async-trait = "0.1"
futures = "0.3"
walkdir = "2.3"
dirs = "5.0"
dircpy = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10"
futures-util = "0.3"
tokio-util = "0.7"
zip = "2"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
