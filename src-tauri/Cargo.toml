[package]
name = "prismsplit"
version = "0.1.0"
description = "PrismSplit Stem Separator"
authors = ["PrismSplit"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dependencies]
tauri = { version = "1.5.0", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
async-trait = "0.1"
futures = "0.3"
walkdir = "2.3"
dirs = "5.0"
dircpy = "0.3"
